name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Placeholder values only: CI never talks to the real Supabase project.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
  SUPABASE_SECRET_KEY: sb_secret_ci
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pos_test
  DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pos_test
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pos_test
  APP_URL: http://localhost:3000
  APP_ENCRYPTION_KEY: Y2ktb25seS1ub3QtYS1yZWFsLWtleS0zMi1ieXRlcyE=
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d pos_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm build
      - name: Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: E2E smoke
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
